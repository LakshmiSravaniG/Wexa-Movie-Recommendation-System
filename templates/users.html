{% extends "base.html" %}

{% block content %}

<h2>Users</h2>

<table class="table table-bordered">

<thead>

<tr>

<th>ID</th>

<th>Name</th>

<th></th>

</tr>

</thead>

<tbody>

{% for user in users %}

<tr>

<td>{{ user.userId }}</td>

<td>{{ user.name }}</td>

<td>

<a
href="/recommend/{{ user.userId }}"
class="btn btn-primary btn-sm">

Recommendations

</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

{% endblock %}

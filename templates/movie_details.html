{% extends "base.html" %}

{% block content %}

<h2>{{ movie.title }}</h2>

<table class="table table-bordered">

<tr>
    <th>ID</th>
    <td>{{ movie.movieId }}</td>
</tr>

<tr>
    <th>Title</th>
    <td>{{ movie.title }}</td>
</tr>

<tr>
    <th>Year</th>
    <td>{{ movie.year }}</td>
</tr>

<tr>
    <th>Genre</th>
    <td>{{ movie.genre }}</td>
</tr>

</table>

<a href="/movies" class="btn btn-secondary">

Back

</a>

{% endblock %}

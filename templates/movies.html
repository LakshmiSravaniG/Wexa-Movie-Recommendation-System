{% extends "base.html" %}

{% block content %}

<h2>Movies</h2>

<form action="/search" method="GET">

    <input
        type="text"
        name="keyword"
        class="form-control"
        placeholder="Search Movie">

</form>

<br>

<table class="table table-bordered">

<thead>

<tr>

<th>ID</th>

<th>Title</th>

<th>Year</th>

<th>Genre</th>

<th></th>

</tr>

</thead>

<tbody>

{% for movie in movies %}

<tr>

<td>{{ movie.movieId }}</td>

<td>{{ movie.title }}</td>

<td>{{ movie.year }}</td>

<td>{{ movie.genre }}</td>

<td>

<a
href="/movie/{{ movie.movieId }}"
class="btn btn-success btn-sm">

View

</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

{% endblock %}
